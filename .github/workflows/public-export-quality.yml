name: Public export quality / 公開export品質

on:
  pull_request:
  push:
    branches:
      - main
      - release/**

permissions:
  contents: read

jobs:
  runtime-package-validation:
    name: Runtime, package, and demo validation / Runtime・Package・Demo検証
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build and test tools
        run: python -m pip install --disable-pip-version-check build pytest
      - name: Install source package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Validate standalone public test scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('tests/public-test-scope.json')
          data = json.loads(manifest_path.read_text(encoding='utf-8'))
          excluded = data['portable_suite']['excluded_modules']
          paths = [item['path'] for item in excluded]
          assert len(paths) == 8, paths
          assert len(paths) == len(set(paths)), paths
          assert all(Path(path).is_file() for path in paths), paths
          assert data['canonical_pre_export_validation']['workflow_run'] == 30711058400
          assert data['canonical_pre_export_validation']['result'] == 'success'
          assert data['portable_suite']['expected_passed_tests'] == 392
          assert data['boundary']['portable_exclusion_is_not_a_pass_claim'] is True
          print('PASS / 合格: explicit standalone public test scope verified')
          PY
      - name: Run standalone portable runtime suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ignored < <(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('tests/public-test-scope.json').read_text(encoding='utf-8'))
          for item in data['portable_suite']['excluded_modules']:
              print(item['path'])
          PY
          )
          args=()
          for path in "${ignored[@]}"; do
            args+=(--ignore "$path")
          done
          python -m pytest -q "${args[@]}" | tee "$RUNNER_TEMP/portable-pytest.txt"
          grep -Eq '392 passed' "$RUNNER_TEMP/portable-pytest.txt"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify clean wheel installation and CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/rpr-wheel-venv"
          "$RUNNER_TEMP/rpr-wheel-venv/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          "$RUNNER_TEMP/rpr-wheel-venv/bin/python" -c "import rpr; print('PASS / 合格: clean wheel import')"
          "$RUNNER_TEMP/rpr-wheel-venv/bin/rpr" --help >/dev/null
      - name: Run production-grade demo tests
        env:
          PYTHONPATH: examples/production-grade-demo
        run: python -m pytest -q examples/production-grade-demo/tests

  structural-validation:
    name: Structural and bilingual validation / 構造・日英検証
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate public export
        run: python tools/validate_public_export.py
      - name: Compile shipped Python sources
        shell: bash
        run: |
          set -euo pipefail
          targets=(tools src examples tests)
          python -m compileall -q "${targets[@]}"

  site-validation:
    name: Static site validation / 静的site検証
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check bilingual entry points
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/ja.html
          test -s site/styles.css
          test -s site/app.js
          grep -F 'href="ja.html"' site/index.html
          grep -F 'href="index.html"' site/ja.html
          grep -F 'prefers-reduced-motion' site/styles.css
          grep -F 'lang="en"' site/index.html
          grep -F 'lang="ja"' site/ja.html

  release-gate-placeholder:
    name: Release gate declaration / Release Gate宣言
    runs-on: ubuntu-latest
    steps:
      - name: Confirm final release remains human-approved
        run: |
          echo 'Preparation checks may pass automatically.'
          echo 'Final tag, GitHub Release, binary upload, Pages publication, and release declaration require Master approval.'
