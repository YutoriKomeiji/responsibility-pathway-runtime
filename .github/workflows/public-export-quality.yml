name: Public export quality / 公開export品質

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
      - fix/**

permissions:
  contents: read

jobs:
  runtime-package-validation:
    name: Complete runtime, package, and demo validation / Runtime・Package・Demo完全検証
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build and test tools
        run: python -m pip install --disable-pip-version-check build pytest
      - name: Install source package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run complete standalone test suite
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/standalone-junit.xml"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify clean wheel installation and CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/rpr-wheel-venv"
          "$RUNNER_TEMP/rpr-wheel-venv/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          "$RUNNER_TEMP/rpr-wheel-venv/bin/python" -c "import rpr; print('PASS / 合格: clean wheel import')"
          "$RUNNER_TEMP/rpr-wheel-venv/bin/rpr" --help >/dev/null
      - name: Run production-grade demo tests
        env:
          PYTHONPATH: examples/production-grade-demo
        run: python -m pytest -q examples/production-grade-demo/tests

  reproducible-artifacts:
    name: Reproducible artifact verification / 配布物再現性検証
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tool
        run: python -m pip install --disable-pip-version-check build
      - name: Build twice and compare bytes
        env:
          SOURCE_DATE_EPOCH: "1785632400"
        shell: bash
        run: |
          set -euo pipefail
          python -m build --outdir "$RUNNER_TEMP/build-a"
          rm -rf build *.egg-info src/*.egg-info
          python -m build --outdir "$RUNNER_TEMP/build-b"
          for first in "$RUNNER_TEMP/build-a"/*; do
            name="$(basename "$first")"
            cmp "$first" "$RUNNER_TEMP/build-b/$name"
          done
          python - "$RUNNER_TEMP/build-a" "$GITHUB_SHA" > "$RUNNER_TEMP/repair-artifact-manifest.json" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          files = []
          for path in sorted(root.iterdir()):
              files.append({
                  "name": path.name,
                  "size_bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          print(json.dumps({
              "schema_version": "1.0",
              "source_commit": sys.argv[2],
              "source_date_epoch": 1785632400,
              "independent_build_count": 2,
              "byte_for_byte_reproducible": True,
              "artifacts": files,
          }, indent=2))
          PY
          cat "$RUNNER_TEMP/repair-artifact-manifest.json"
      - name: Retain repair artifact evidence
        uses: actions/upload-artifact@v4
        with:
          name: rpr-0.1.0a2-repair-artifact-evidence
          path: ${{ runner.temp }}/repair-artifact-manifest.json
          if-no-files-found: error

  formal-validation:
    name: Lean 4 and cross-model validation / Lean 4・モデル整合検証
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build pinned Lean formal package
        working-directory: formal
        run: |
          lake update
          lake build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source package and pytest
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Verify JSON, Python, and Lean parity
        run: python -m pytest -q tests/test_formal_consistency.py tests/test_canonical_transition_spec.py

  structural-validation:
    name: Structural and bilingual validation / 構造・日英検証
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate public export and terminology
        run: python tools/validate_public_export.py
      - name: Compile shipped Python sources
        run: python -m compileall -q tools src examples tests

  site-validation:
    name: Static site validation / 静的site検証
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check bilingual entry points
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/ja.html
          test -s site/styles.css
          test -s site/app.js
          grep -F 'href="ja.html"' site/index.html
          grep -F 'href="index.html"' site/ja.html
          grep -F 'prefers-reduced-motion' site/styles.css
          grep -F 'lang="en"' site/index.html
          grep -F 'lang="ja"' site/ja.html

  release-gate-placeholder:
    name: Release gate declaration / Release Gate宣言
    runs-on: ubuntu-latest
    steps:
      - name: Confirm final release remains human-approved
        run: |
          echo 'Preparation checks may pass automatically.'
          echo 'Final tag, GitHub Release, binary upload, Pages publication, and release declaration require approval from the authorized release owner.'
