name: Bootstrap verified public assembly

on:
  push:
    branches:
      - release/0.1.0a2
    paths:
      - ".github/workflows/bootstrap-public-assembly.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.1.0a2
          fetch-depth: 0
      - name: Download and verify complete preparation artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/rpr-public.zip" 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-08d0-8209-b6ae-024bb35221fc/raw?se=2026-08-01T18:18:04Z&sp=r&sv=2026-02-06&sr=b&scid=d820da3c-436b-5234-a5e4-1646bd630278&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T03:45:15Z&ske=2026-08-02T03:45:15Z&sks=b&skv=2026-02-06&sig=oy395BSJzSN0VIHndkkJgO5WnvgaKt3E04w0d86aYQs%3D'
          echo "f3e9627f6ed444e3b419a860f68640b070668faa9a4be7f27e0f9b5b4b58895d  $RUNNER_TEMP/rpr-public.zip" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/rpr-public"
          unzip -q "$RUNNER_TEMP/rpr-public.zip" -d "$RUNNER_TEMP/rpr-public"
      - name: Reduce artifact to canonical repository set
        shell: bash
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/rpr-public" -type d \( -name build -o -name dist -o -name __pycache__ -o -name .pytest_cache -o -name '*.egg-info' \) -prune -exec rm -rf {} +
          test "$(find "$RUNNER_TEMP/rpr-public" -type f | wc -l)" -eq 180
          test -s "$RUNNER_TEMP/rpr-public/.github/workflows/public-export-quality.yml"
          test -s "$RUNNER_TEMP/rpr-public/.github/workflows/deploy-pages.yml"
          test -s "$RUNNER_TEMP/rpr-public/docs/en/README.md"
          test -s "$RUNNER_TEMP/rpr-public/docs/ja/README.md"
          python "$RUNNER_TEMP/rpr-public/tools/validate_public_export.py"
      - name: Replace branch contents with verified canonical tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/rpr-public/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No transfer changes detected"; exit 1; }
          git commit -m "release: transfer verified RPR 0.1.0a2 assembly"
          git push origin HEAD:release/0.1.0a2
