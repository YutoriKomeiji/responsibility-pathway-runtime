name: Bootstrap verified public assembly

on:
  push:
    branches:
      - release/0.1.0a2
    paths:
      - ".transfer/trigger"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.1.0a2
          fetch-depth: 0
      - name: Download and verify complete preparation artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/rpr-public.zip" 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-1ccc-8209-bb5c-185190b7ae65/raw?se=2026-08-01T18:21:23Z&sp=r&sv=2026-02-06&sr=b&scid=39f0ecd0-a01c-5b74-82ff-b77a8c65e319&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T01:24:35Z&ske=2026-08-02T01:24:35Z&sks=b&skv=2026-02-06&sig=kCC0iWQvU2VxW79Yv%2B6Le0s8kz1jBELcmrB8X13rZ%2Bw%3D'
          echo "f3e9627f6ed444e3b419a860f68640b070668faa9a4be7f27e0f9b5b4b58895d  $RUNNER_TEMP/rpr-public.zip" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/rpr-public"
          unzip -q "$RUNNER_TEMP/rpr-public.zip" -d "$RUNNER_TEMP/rpr-public"
      - name: Reduce artifact to canonical non-workflow transfer set
        shell: bash
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/rpr-public" -type d \( -name build -o -name dist -o -name __pycache__ -o -name .pytest_cache -o -name '*.egg-info' \) -prune -exec rm -rf {} +
          test "$(find "$RUNNER_TEMP/rpr-public" -type f | wc -l)" -eq 180
          test -s "$RUNNER_TEMP/rpr-public/.github/workflows/public-export-quality.yml"
          test -s "$RUNNER_TEMP/rpr-public/.github/workflows/deploy-pages.yml"
          test -s "$RUNNER_TEMP/rpr-public/docs/en/README.md"
          test -s "$RUNNER_TEMP/rpr-public/docs/ja/README.md"
          python "$RUNNER_TEMP/rpr-public/tools/validate_public_export.py"
          rm -rf "$RUNNER_TEMP/rpr-public/.github/workflows"
      - name: Replace branch contents while preserving bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/bootstrap-public-assembly.yml "$RUNNER_TEMP/bootstrap-public-assembly.yml"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/rpr-public/." .
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/bootstrap-public-assembly.yml" .github/workflows/bootstrap-public-assembly.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No transfer changes detected"; exit 1; }
          git commit -m "release: transfer verified RPR 0.1.0a2 assembly"
          git push origin HEAD:release/0.1.0a2
