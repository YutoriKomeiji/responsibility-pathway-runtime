# Language: YAML
# Purpose: Build the RPR wheel, verify the shared live-demo scenario, and publish the site to GitHub Pages.
# Boundary: No package index publication, tag, GitHub Release, or external runtime service is created.
name: Build and deploy GitHub Pages

on:
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "site/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          test -f dist/responsibility_pathway_runtime-0.1.0a2-py3-none-any.whl
      - name: Install built wheel
        run: python -m pip install dist/responsibility_pathway_runtime-0.1.0a2-py3-none-any.whl
      - name: Run the shared live-demo scenario under CPython
        run: |
          python site/demo_scenario.py > demo-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("demo-result.json").read_text(encoding="utf-8"))
          assert payload["ok"] is True, payload
          result = payload["result"]["reconciled"]
          assert result["state_before"] == "write_status_unknown", result
          assert result["state"] == "completed", result
          assert result["dispatch_count"] == 1, result
          assert result["duplicate_dispatch_prevented"] is True, result
          assert result["evidence_valid"] is True, result
          PY
      - name: Assemble Pages artifact
        run: |
          mkdir -p site/assets
          cp dist/responsibility_pathway_runtime-0.1.0a2-py3-none-any.whl site/assets/
          sha256sum site/assets/responsibility_pathway_runtime-0.1.0a2-py3-none-any.whl > site/assets/wheel.sha256
          cp demo-result.json site/assets/cpython-demo-result.json
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium test dependency
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Verify the real wheel inside Chromium and Pyodide
        run: |
          python -m http.server 8000 --directory site > /tmp/rpr-pages-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const browserLog = [];
            page.on('console', message => {
              const line = `[browser:${message.type()}] ${message.text()}`;
              browserLog.push(line);
              console.log(line);
            });
            page.on('pageerror', error => {
              const line = `[browser:error] ${error.stack || error.message}`;
              browserLog.push(line);
              console.error(line);
            });

            try {
              await page.goto('http://127.0.0.1:8000/demo.html', { waitUntil: 'domcontentloaded' });
              await page.click('#load-runtime');
              await page.waitForFunction(
                () => {
                  const root = document.documentElement.dataset;
                  return root.runtimeReady === 'true' || root.runtimeReady === 'false';
                },
                null,
                { timeout: 180000 }
              );

              const startup = await page.evaluate(() => ({
                runtimeReady: document.documentElement.dataset.runtimeReady,
                stage: document.documentElement.dataset.demoStage,
                error: document.documentElement.dataset.demoError,
                python: document.querySelector('#python-status')?.textContent,
                package: document.querySelector('#package-status')?.textContent,
                output: document.querySelector('#output')?.textContent,
              }));
              console.log(`[browser:startup] ${JSON.stringify(startup)}`);
              if (startup.runtimeReady !== 'true') throw new Error(`runtime startup failed: ${JSON.stringify(startup)}`);
              if (startup.package !== 'RPR 0.1.0a2') throw new Error(`unexpected package status: ${JSON.stringify(startup)}`);

              await page.click('#run-all');
              await page.waitForFunction(
                () => document.documentElement.dataset.demoState === 'completed',
                null,
                { timeout: 60000 }
              );
              const result = await page.evaluate(() => ({
                state: document.querySelector('#current-state')?.textContent,
                dispatchCount: document.querySelector('#dispatch-count')?.textContent,
                evidence: document.querySelector('#evidence-status')?.textContent,
                output: document.querySelector('#output')?.textContent,
                demoOk: document.documentElement.dataset.demoOk,
              }));
              if (result.demoOk !== 'true') throw new Error(JSON.stringify(result));
              if (result.state !== 'completed') throw new Error(JSON.stringify(result));
              if (result.dispatchCount !== '1') throw new Error(JSON.stringify(result));
              if (result.evidence !== '検証済み') throw new Error(JSON.stringify(result));
              const payload = JSON.parse(result.output);
              const reconciled = payload.result.reconciled;
              if (reconciled.state_before !== 'write_status_unknown') throw new Error(result.output);
              if (reconciled.duplicate_dispatch_prevented !== true) throw new Error(result.output);
              if (reconciled.evidence_valid !== true) throw new Error(result.output);
              console.log(JSON.stringify(result));
            } catch (error) {
              const snapshot = await page.evaluate(() => ({
                htmlDataset: { ...document.documentElement.dataset },
                python: document.querySelector('#python-status')?.textContent,
                package: document.querySelector('#package-status')?.textContent,
                state: document.querySelector('#current-state')?.textContent,
                output: document.querySelector('#output')?.textContent,
                summary: document.querySelector('#summary')?.textContent,
              })).catch(() => ({ unavailable: true }));
              console.error(`[browser:snapshot] ${JSON.stringify(snapshot)}`);
              console.error(`[browser:log] ${JSON.stringify(browserLog)}`);
              throw error;
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error.stack || error);
            process.exit(1);
          });
          JS
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload verification artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rpr-pages-preview
          path: site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
