name: Build and publish Python package

on:
  workflow_dispatch:
  release:
    types: [published, edited]

jobs:
  release-gate:
    name: Verify bounded release event
    if: github.event_name != 'release' || github.event.release.tag_name == 'v0.1.0a5'
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact release boundary
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            test "${{ github.event.release.tag_name }}" = "v0.1.0a5"
            case "${{ github.event.action }}" in
              published|edited) ;;
              *) echo "Unsupported release action"; exit 1 ;;
            esac
          else
            echo "workflow_dispatch remains build-only."
          fi

  build:
    name: Build and validate distributions
    needs: release-gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Validate rendered long description
        run: python tools/check_distribution_long_description.py --root . --dist dist

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Verify package and CLIs
        run: |
          python -c "import rpr; print(rpr.__file__)"
          rpr --help
          rpr-mcp --help

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    if: github.event_name == 'release' && github.event.release.tag_name == 'v0.1.0a5'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/responsibility-pathway-runtime/

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
